[project]
name = "fitness-freaks-ai"
version = "0.1.0"
description = "Fitness Coach AI - An intelligent assistant that helps users manage their fitness journey"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.2",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.6",
    "langchain>=0.1.0",
    "langchain-groq>=0.1.0", # For Groq API
    "groq>=0.4.0", # Groq's Python SDK
    "pyyaml>=6.0",
    "google-generativeai>=0.8.5",
    "langchain-google-genai>=2.0.10",
    "pytest>=8.3.5",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]
